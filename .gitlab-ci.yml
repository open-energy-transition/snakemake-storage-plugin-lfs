stages:
  - test
  - build
  - publish

.install-uv: &install-uv
  image: python:3.12-bookworm
  before_script:
    - test -f .cache/bin/uv || (mkdir -p .cache/bin && curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=$CI_PROJECT_DIR/.cache/bin sh)
    - export PATH="$CI_PROJECT_DIR/.cache/bin:$PATH"
  cache:
    key: uv
    paths:
      - .cache/bin/
      - .cache/uv/
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv

test:
  <<: *install-uv
  stage: test
  script:
    - uv run pytest

build:
  <<: *install-uv
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish:
  <<: *install-uv
  stage: publish
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - uv publish
        --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
        --username gitlab-ci-token
        --password ${CI_JOB_TOKEN}
        dist/*
